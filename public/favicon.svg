<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#0e0f14" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Inner subtle fill -->
  <rect x="4" y="4" width="24" height="24" rx="4.5" fill="rgba(124,77,255,0.08)"/>

  <!-- Code brackets </> -->
  <g stroke="url(#code-grad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="12.5,12.5 8,16 12.5,19.5"/>
    <line x1="17.5" y1="11" x2="14.5" y2="21"/>
    <polyline points="19.5,12.5 24,16 19.5,19.5"/>
  </g>

  <!-- Accent dot (mint/teal) -->
  <circle cx="26" cy="5" r="2.5" fill="#2dd4a8" opacity="0.85"/>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="border-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(124,77,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(124,77,255,0.15)"/>
    </linearGradient>
    <linearGradient id="code-grad" x1="8" y1="11" x2="24" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d946a8"/>
    </linearGradient>
  </defs>
</svg>
